{% extends "base.html" %}
{% load i18n judging static problems icons %}
{% block title %}{% translate "Submission" %} #{{ submission.pk }}{% endblock %}
{% block scripts %}
{# No inline <style> from htmx (we don't use its loading indicator): the CSP allows no inline styles. #}
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
{% endblock %}
{% block content %}
<h1>{% translate "Submission" %} #{{ submission.pk }}</h1>
<ul class="badges">
  <li><span class="badge">{% translate "Problem" %}: <a href="{% url 'problem' submission.problem.slug %}">{% problem_title submission.problem %}</a></span></li>
  <li><span class="badge">{% icon "user" %}{% translate "User" %}: <a href="{% url 'profile' submission.user.username %}">{{ submission.user.username }}</a></span></li>
  <li><span class="badge">{% icon "code" %}{% translate "Language" %}: {{ submission.language|language_name }}</span></li>
  <li><span class="badge">{% icon "clock" %}{% translate "Submitted" %}: {{ submission.created_at|date:"Y-m-d H:i:s" }}</span></li>
</ul>

{% include "judging/results.html" %}

{% if is_author %}
<h2>{% translate "Your code" %} <small><a href="{% url 'submission-source' submission.pk %}">{% translate "plain text" %}</a></small></h2>
<pre><code>{{ submission.source }}</code></pre>
{% endif %}
{% endblock %}
