# The Django web app. One image, two roles (GRADER_ROLE=public | admin).
# It is an application, not a library, so uv installs its dependencies but not the code itself.
[project]
name = "grader-web"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "authlib>=1.9,<2",
    "cryptography>=45",
    "django>=5.2,<5.3",
    "grader-common",
    "joserfc>=1.7,<2",
    "markdown-it-py>=4,<5",
    "nh3>=0.3,<0.4",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.34,<3",
    "whitenoise>=6.12,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
grader-common = { workspace = true }
