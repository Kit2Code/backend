{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<article {% if marker %}data-{{ marker }}{% endif %}>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if link_url %}<p><a href="{{ link_url }}">{{ link_text }}</a></p>{% endif %}
</article>
{% endblock %}
