{% extends "admin/base_site.html" %}
{% load i18n static %}
{% block extrahead %}{{ block.super }}
{# No inline <style> from htmx: the CSP allows no inline styles. #}
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
{% endblock %}
{% block breadcrumbs %}<div class="breadcrumbs"><a href="{% url 'admin:index' %}">{% translate "Home" %}</a> &rsaquo; <a href="{% url 'admin:grader-problems' %}">{% translate "Problems" %}</a> &rsaquo; {{ title }}</div>{% endblock %}
{% block content %}
{% if problem %}<p class="help">{% translate "Saving makes a new version of the problem. Files you don't upload again are kept from the current version. A public problem keeps its current version until the new one passes validation and is published." %}</p>{% endif %}
{% if error %}<p class="editor-error">{{ error }}</p>{% endif %}
{% if form.errors %}<p class="errornote">{% translate "Please correct the errors below." %}</p>{{ form.non_field_errors }}{% endif %}

<form method="post" enctype="multipart/form-data" class="problem-editor" novalidate>
  {% csrf_token %}

  <fieldset class="module aligned">
    <h2>{% translate "The problem" %}</h2>
    {% for field in form %}{% if field.name in "slug title_th title_en group tags time_limit_ms memory_limit_mb languages" %}
    <div class="form-row">{{ field.errors }}{{ field.label_tag }} {{ field }}{% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}</div>
    {% endif %}{% endfor %}
  </fieldset>

  <fieldset class="module aligned">
    <h2>{% translate "Statement" %}</h2>
    <div class="form-row">{{ form.statement_th.errors }}{{ form.statement_th.label_tag }} {{ form.statement_th }}</div>
    <div class="form-row">{{ form.statement_en.errors }}{{ form.statement_en.label_tag }} {{ form.statement_en }}</div>
    <div class="form-row">
      <button type="button" class="button" hx-post="{% url 'admin:grader-statement-preview' %}" hx-params="statement_th,csrfmiddlewaretoken" hx-target="#statement-preview">{% translate "Preview the Thai statement" %}</button>
      <button type="button" class="button" hx-post="{% url 'admin:grader-statement-preview' %}" hx-params="statement_en,csrfmiddlewaretoken" hx-target="#statement-preview">{% translate "Preview the English statement" %}</button>
      <div id="statement-preview"></div>
    </div>
    <div class="form-row">{{ form.statement_pdf_th.errors }}{{ form.statement_pdf_th.label_tag }} {{ form.statement_pdf_th }}</div>
    <div class="form-row">{{ form.statement_pdf_en.errors }}{{ form.statement_pdf_en.label_tag }} {{ form.statement_pdf_en }}</div>
  </fieldset>

  <fieldset class="module aligned">
    <h2>{% translate "Tests and scoring" %}</h2>
    {% if problem %}<p class="help">{% translate "Leave both empty to keep the current tests." %}</p>{% endif %}
    {% for field in form %}{% if field.name in "tests tests_zip samples scoring total subtasks checker checker_file" %}
    <div class="form-row">{{ field.errors }}{{ field.label_tag }} {{ field }}{% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}</div>
    {% endif %}{% endfor %}
  </fieldset>

  <fieldset class="module aligned">
    <h2>{% translate "Reference solutions" %}</h2>
    <p class="help">{% translate "Used to validate the problem before it can be opened." %}{% if problem %} {% translate "Upload none to keep the current ones; upload any to replace them all." %}{% endif %}</p>
    {% for file, language, score in solution_slots %}
    <div class="form-row solution-row">
      {{ file.errors }}{{ language.errors }}{{ score.errors }}
      {{ file.label_tag }} {{ file }} {{ language.label_tag }} {{ language }} {{ score.label_tag }} {{ score }}
    </div>
    {% endfor %}
  </fieldset>

  <div class="submit-row">
    <input type="submit" class="default" value="{% translate "Save and validate" %}">
  </div>
</form>
{% endblock %}
