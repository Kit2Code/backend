# The judge worker: runs submissions inside isolate and talks only to web-admin's internal API.
[project]
name = "grader-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grader-common",
    "pydantic>=2.11,<3",
]

[project.scripts]
judge-run = "grader_worker.cli:judge_run"
judge-env = "grader_worker.cli:judge_env"
judge-worker = "grader_worker.client:judge_worker"
judge-selftest = "grader_worker.cli:judge_selftest"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grader_worker"
