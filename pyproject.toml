# Workspace root. It is not a package itself: it ties the three members together, holds the
# shared dev tools, and configures ruff, mypy and pytest for the whole repo. One lockfile: uv.lock.
[project]
name = "grader-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["grader-web", "grader-worker", "grader-common"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.13",
    "mypy>=1.18",
    "django-stubs[compatible-mypy]>=5.2",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
    "pytest-playwright>=0.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["web", "judge/worker", "common"]

[tool.uv.sources]
grader-web = { workspace = true }
grader-worker = { workspace = true }
grader-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Where our own top-level modules live (for import sorting).
src = ["web", "judge/worker/src", "common"]
extend-exclude = [".devdata", "**/migrations", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things; tests use made-up passwords on purpose
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["web", "judge/worker/src", "common", "judge/worker/tests/sandbox"]
explicit_package_bases = true
exclude = ['^\.devdata/', '^fixtures/', '/migrations/']
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
# Authlib ships no type hints; its few uses in accounts/google.py are wrapped in typed functions.
module = ["authlib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["web"]
# The worker tests fork processes, so they run before the browser tests start Playwright's threads.
testpaths = ["common/tests", "judge/worker/tests", "web/tests", "deploy/tests"]
markers = [
    "sandbox: needs the dev stack's worker container with real isolate",
    "devstack: needs the running dev stack (edge, web roles, fake sign-in provider)",
]
addopts = "--strict-markers"
