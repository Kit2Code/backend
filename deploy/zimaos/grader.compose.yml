# The grader as one ZimaOS app: in the ZimaOS dashboard, App Store → Custom Install → Import, paste
# this file. Step by step, with what to change afterwards: docs/DEPLOY.md.
#
# Before the first start, change these in the app's settings (they are placeholders here):
#   web       PUBLIC_BASE_URL   https://<your public hostname>
#   web-admin ADMIN_BASE_URL    http://<the NAS's LAN address>:8081  (and PUBLIC_BASE_URL as above)
#   tunnel    TUNNEL_TOKEN      the token of the Cloudflare tunnel made for the grader
#
# The grader's own images are pinned to the exact release (version@digest, from the release run's
# "Image digests" summary); to update, see docs/DEPLOY.md, "Updating to a new version".
#
# All data lives under /DATA/AppData/grader. CPU 3 runs the services and CPUs 4,5 the judge's
# sandboxes, away from CPUs 0-2 (a CMS installation's workers); see docs/DEPLOY.md to change it.
name: grader

services:
  # One-shot: makes the secrets the first time, then gives each service its own copies; also gives
  # the folders web-admin writes to (uploads, problems) to the web user.
  secrets-init:
    image: ghcr.io/kit2code/grader-ops:0.1.1@sha256:a6f75f7448198b1f48ad088218ad6290869e01f2ed1dde3a6b083f1a2e6258b3
    command: ["secrets-init"]
    restart: "no"
    network_mode: none
    cpuset: "3"
    mem_limit: 64m
    volumes:
      - /DATA/AppData/grader/secrets:/secrets
      - /DATA/AppData/grader/uploads:/data/uploads
      - /DATA/AppData/grader/problems:/data/problems
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_USER: grader
      POSTGRES_DB: grader
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
      TZ: Asia/Bangkok
    volumes:
      - /DATA/AppData/grader/postgres:/var/lib/postgresql/data
      - /DATA/AppData/grader/secrets/db:/run/secrets/db:ro
    networks: [db_net]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grader", "-d", "grader"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # One-shot: makes the database role the web site logs in as (grader_app, not a superuser) and
  # gives it the tables; runs at every start, after the database is up.
  db-init:
    image: ghcr.io/kit2code/grader-ops:0.1.1@sha256:a6f75f7448198b1f48ad088218ad6290869e01f2ed1dde3a6b083f1a2e6258b3
    command: ["db-init"]
    restart: "no"
    networks: [db_net]
    depends_on:
      db: {condition: service_healthy}
    cpuset: "3"
    mem_limit: 64m
    volumes:
      - /DATA/AppData/grader/secrets/db:/run/secrets/db:ro
    logging: *logging

  # The public site (GRADER_ROLE=public): reached only through the edge's :8080, from the tunnel.
  web:
    image: ghcr.io/kit2code/grader-web:0.1.1@sha256:2a85ec9b1943a81fcef3041c796afd347f48e149c8c42333473c452544b101ae
    environment:
      GRADER_ROLE: public
      PUBLIC_BASE_URL: "https://grader.example.org"
      GRADER_SECRETS_DIR: /run/secrets/web
      GRADER_DB_HOST: db
      GRADER_DB_USER: grader_app
      # The edge's address: only it may tell the site who the visitor is.
      GRADER_EDGE_ADDRESSES: "10.89.91.10"
      TZ: Asia/Bangkok
    volumes:
      - /DATA/AppData/grader/problems:/data/problems:ro
      - /DATA/AppData/grader/secrets/web:/run/secrets/web:ro
    networks:
      app_net: {ipv4_address: 10.89.91.20}
      db_net: {}
    depends_on:
      db-init: {condition: service_completed_successfully}
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 384m
    healthcheck: &web_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  # The admin site (GRADER_ROLE=admin): Django admin, admin pages, first-run setup, the judge API.
  # Only this role runs database migrations.
  web-admin:
    image: ghcr.io/kit2code/grader-web:0.1.1@sha256:2a85ec9b1943a81fcef3041c796afd347f48e149c8c42333473c452544b101ae
    environment:
      GRADER_ROLE: admin
      ADMIN_BASE_URL: "http://192.0.2.10:8081"
      PUBLIC_BASE_URL: "https://grader.example.org"
      # Other addresses you open the admin site at (comma-separated), e.g. the NAS's Tailscale IP.
      GRADER_ADMIN_EXTRA_URLS: ""
      GRADER_SECRETS_DIR: /run/secrets/web
      GRADER_WORKER_SECRETS_DIR: /run/secrets/worker
      GRADER_DB_HOST: db
      GRADER_DB_USER: grader_app
      GRADER_EDGE_ADDRESSES: "10.89.91.10"
      TZ: Asia/Bangkok
    volumes:
      - /DATA/AppData/grader/problems:/data/problems
      - /DATA/AppData/grader/uploads:/data/uploads
      - /DATA/AppData/grader/backups:/data/backups:ro
      - /DATA/AppData/grader/secrets/web:/run/secrets/web:ro
      - /DATA/AppData/grader/secrets/worker:/run/secrets/worker:ro
    networks:
      app_net: {ipv4_address: 10.89.91.21}
      db_net: {}
      judge_net: {}
    depends_on:
      db-init: {condition: service_completed_successfully}
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 384m
    healthcheck: *web_health
    logging: *logging

  # The judge. isolate needs CAP_SYS_ADMIN (namespaces, mounts; the entrypoint also re-mounts the
  # container's cgroup tree read-write) and CAP_NET_ADMIN (it switches on the loopback interface in
  # each sandbox's own network namespace). docs/DECISIONS.md, "Worker profile". No internet, no
  # database, one secret.
  worker:
    image: ghcr.io/kit2code/grader-worker:0.1.1@sha256:6a18944c95b6c8b4fa854acc40187cd53ae2ecb670c6a3685d94ff1ded39dc1c
    hostname: grader-worker
    # Its own cgroup namespace: the boxes' cgroups live inside the container's, and nothing of the
    # host's or other containers' cgroups is visible.
    cgroup: private
    # Only what isolate needs (docs/DECISIONS.md, "Worker profile"); no MKNOD, no NET_RAW.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, NET_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, SYS_CHROOT]
    # Docker's default seccomp filter for the worker; every box adds our own (box-exec).
    security_opt: ["apparmor=unconfined", "no-new-privileges:true"]
    pids_limit: 512
    init: true
    environment:
      JUDGE_SLOTS: "2"
      JUDGE_BOX_CPUS: "4,5"
      WORKER_CPUS: "3"
      JUDGE_MEM_TOTAL: "1024M"
      WEB_INTERNAL_URL: "http://web-admin:8000"
      TZ: Asia/Bangkok
    volumes:
      - /DATA/AppData/grader/problems:/data/problems:ro
      - /DATA/AppData/grader/judge-cache:/data/cache
      - /DATA/AppData/grader/secrets/worker:/run/secrets/worker:ro
    networks: [judge_net]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
    restart: unless-stopped
    # The worker process on CPU 3 (WORKER_CPUS) and the sandboxes on 4,5 (JUDGE_BOX_CPUS); the memory
    # limit covers both: JUDGE_MEM_TOTAL for the boxes plus 384m for the worker.
    cpuset: "3,4,5"
    mem_limit: 1408m
    healthcheck:
      # The judge loop is going and some slot still works (grader_worker.health).
      test: ["CMD", "judge-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  # The only way in: :8080 public (tunnel only), :8081 admin (published), :8090 Google sign-in.
  edge:
    image: ghcr.io/kit2code/grader-edge:0.1.1@sha256:f3bf50ca6dd59f1cb374cd5ba26b03d58a0cf1175fe834b8c46299f83f985461
    environment:
      # Refuse to start if a Google upstream isn't https (it carries the Google client secret).
      GRADER_REQUIRE_HTTPS_UPSTREAMS: "1"
    ports: ["8081:8081"]
    networks:
      edge_net: {}
      app_net: {ipv4_address: 10.89.91.10}
    depends_on: [web, web-admin]
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8079/"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # Cloudflare tunnel: public hostname → http://edge:8080 (set in the Cloudflare Zero Trust dashboard).
  tunnel:
    image: cloudflare/cloudflared:2026.9.2@sha256:3d92367cab219a86f748128512f5c28b31cbf54faacececa0eff6a8c2085ed5f
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:60123", "run"]
    environment:
      TUNNEL_TOKEN: "PASTE_IN_ZIMAOS_UI_NOT_IN_GIT"
    networks: [edge_net]
    depends_on: [edge]
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging

  # Nightly database backups at BACKUP_TIME, plus "Back up now" from the admin Backups page.
  backup:
    image: ghcr.io/kit2code/grader-ops:0.1.1@sha256:a6f75f7448198b1f48ad088218ad6290869e01f2ed1dde3a6b083f1a2e6258b3
    command: ["backup-loop"]
    environment:
      BACKUP_TIME: "03:30"
      BACKUP_KEEP: "14"
      TZ: Asia/Bangkok
    volumes:
      - /DATA/AppData/grader/backups:/backups
      - /DATA/AppData/grader/secrets/backup:/run/secrets/backup:ro
    networks: [db_net]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
    restart: unless-stopped
    cpuset: "3"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db", "-U", "grader", "-d", "grader"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  # Internet for the tunnel only (and the edge's :8090 calls to Google).
  edge_net: {}
  app_net:
    internal: true
    ipam:
      config:
        - subnet: 10.89.91.0/24
  db_net: {internal: true}
  judge_net: {internal: true}

x-casaos:
  architectures: [amd64]
  main: edge
  author: Kit2Code
  developer: Kit2Code
  category: Developer
  title:
    en_US: Grader
  tagline:
    en_US: Practice grader for past contest problems
  description:
    en_US: >-
      A Thai/English practice site for old CMS contest problems: Google sign-in for students,
      sandboxed judging with isolate, and an admin site on the LAN. The public site is served
      through a Cloudflare tunnel.
  index: /admin/
  port_map: "8081"
  scheme: http
