# Dev stack. It mirrors production (same networks, the same image in two web roles, a worker
# with isolate) but builds images from source and mounts the code, so edits reload.
# Start it with ./init.sh from the repo root. Data lives in ./.devdata (gitignored).
#
# Differences from production, on purpose (see docs/DECISIONS.md):
# - `dev_ports` is an extra normal network so the host can reach Postgres and the edge on
#   127.0.0.1 only. The web roles and the worker are NOT on it: like production, they have no
#   route out, and the host reaches the web roles only through the edge.
# - The edge is the production edge image (deploy/edge/), given dev addresses. Its :8090 "Google"
#   listener forwards to `fake-oidc`, a fake Google sign-in for dev and
#   tests (deploy/dev/fake-oidc/), instead of to Google. fake-oidc sits on its own normal network
#   (standing in for the internet) that only the edge joins, and publishes 127.0.0.1:8099 so the
#   browser can open its sign-in page.
# - app_net has a fixed subnet so the edge's :8090 can listen on its app_net address only and
#   accept only the web roles' addresses (production does the same, with another subnet).
# - Postgres data is a named volume instead of a folder.
# - Django runs with runserver (code reload) instead of gunicorn (the image's `dev` stage).
name: grader-dev

x-web: &web
  build:
    context: ../..
    dockerfile: web/Dockerfile
    target: dev
  # Run as the developer's own user so files in .devdata stay readable and deletable.
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
  restart: unless-stopped
  depends_on: [db]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 30

x-web-env: &web-env
  PUBLIC_BASE_URL: "http://127.0.0.1:8000"
  ADMIN_BASE_URL: "http://127.0.0.1:8001"
  GRADER_SECRETS_DIR: /run/secrets/web
  GRADER_WORKER_SECRETS_DIR: /run/secrets/worker
  GRADER_DB_HOST: db
  GRADER_STATIC_FROM_APPS: "1"
  TZ: Asia/Bangkok

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_USER: grader
      POSTGRES_DB: grader
      POSTGRES_PASSWORD_FILE: /run/secrets/db/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../.devdata/secrets/db:/run/secrets/db:ro
    networks: [db_net, dev_ports]
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grader", "-d", "grader"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    <<: *web
    environment:
      <<: *web-env
      GRADER_ROLE: public
      # Sign in with the fake provider: the browser opens its page on the host's port 8099; the
      # token and keys still go through the edge's :8090 (the production defaults).
      GRADER_GOOGLE_AUTHORIZE_URL: "http://127.0.0.1:8099/authorize"
      GRADER_GOOGLE_ISSUERS: "http://127.0.0.1:8099"
    volumes:
      - ../../web:/app/web
      - ../../common:/app/common
      - ../../.devdata/problems:/data/problems:ro
      - ../../.devdata/secrets/web:/run/secrets/web:ro
    networks:
      app_net: {ipv4_address: 10.89.90.20}
      db_net: {}

  web-admin:
    <<: *web
    environment:
      <<: *web-env
      GRADER_ROLE: admin
    volumes:
      - ../../web:/app/web
      - ../../common:/app/common
      - ../../.devdata/problems:/data/problems
      - ../../.devdata/uploads:/data/uploads
      - ../../.devdata/backups:/data/backups:ro
      - ../../.devdata/secrets/web:/run/secrets/web:ro
      - ../../.devdata/secrets/worker:/run/secrets/worker:ro
    networks:
      # A fixed address: the edge lets web-admin fetch the Google keys (and nothing else) on :8090.
      app_net: {ipv4_address: 10.89.90.21}
      db_net: {}
      judge_net: {}

  edge:
    # The production edge image and Caddyfile (deploy/edge/), with the dev stack's addresses.
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    environment:
      GRADER_EDGE_APP_IP: 10.89.90.10
      GRADER_WEB_IP: 10.89.90.20
      GRADER_WEB_ADMIN_IP: 10.89.90.21
      GRADER_PUBLIC_PROTO: http
      GRADER_GOOGLE_TOKEN_UPSTREAM: http://fake-oidc:8099
      GRADER_GOOGLE_CERTS_UPSTREAM: http://fake-oidc:8099
      GRADER_GOOGLE_CERTS_PATH: /certs
    networks:
      app_net: {ipv4_address: 10.89.90.10}
      dev_ports: {}
      fake_google_net: {}
    ports: ["127.0.0.1:8000:8080", "127.0.0.1:8001:8081"]
    depends_on: [web, web-admin, fake-oidc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8079/"]
      interval: 5s
      timeout: 5s
      retries: 30

  fake-oidc:
    # The web image already has Python and joserfc; only the script is mounted in.
    build:
      context: ../..
      dockerfile: web/Dockerfile
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    entrypoint: ["python", "/app/fake-oidc/server.py"]
    environment:
      FAKE_OIDC_ISSUER: "http://127.0.0.1:8099"
      FAKE_OIDC_CLIENT_ID: "grader-dev.apps.example"
      FAKE_OIDC_SECRET_FILE: /run/secrets/fake-oidc/client_secret
      FAKE_OIDC_REDIRECT_URIS: "http://127.0.0.1:8000/auth/google/callback,http://localhost:8000/auth/google/callback"
    volumes:
      - ./fake-oidc:/app/fake-oidc:ro
      - ../../.devdata/secrets/fake-oidc:/run/secrets/fake-oidc:ro
    networks: [fake_google_net]
    ports: ["127.0.0.1:8099:8099"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: judge/worker/Dockerfile
    command: ["judge-worker"]
    # The production profile (deploy/zimaos/grader.compose.yml), so every sandbox test runs under it.
    cap_add: [SYS_ADMIN, NET_ADMIN]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    cgroup: host
    init: true
    restart: unless-stopped
    environment:
      JUDGE_SLOTS: "2"
      JUDGE_BOX_CPUS: "10,11"
      JUDGE_MEM_TOTAL: "1024M"
      WEB_INTERNAL_URL: "http://web-admin:8000"
      TZ: Asia/Bangkok
    volumes:
      # Live code, like the web roles (the image has the same code baked in). Read-only: a process
      # that got root in this container must not be able to change the repo's source.
      - ../../judge/worker:/app/judge/worker:ro
      - ../../common:/app/common:ro
      # Test programs and problems for the sandbox tests, read-only.
      - ../../fixtures:/app/fixtures:ro
      - ../../.devdata/problems:/data/problems:ro
      - ../../.devdata/judge-cache:/data/cache
      - ../../.devdata/secrets/worker:/run/secrets/worker:ro
    networks: [judge_net]
    healthcheck:
      test: ["CMD", "test", "-d", "/sys/fs/cgroup/grader-judge"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app_net:
    internal: true
    ipam:
      config: [{subnet: 10.89.90.0/24}]
  db_net: {internal: true}
  judge_net: {internal: true}
  dev_ports: {}
  fake_google_net: {}

volumes:
  pgdata: {}
