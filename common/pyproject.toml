# Code shared by the web app, the importer and the judge worker.
[project]
name = "grader-common"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grader_common"
module-root = ""
